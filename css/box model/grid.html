<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Grid</title>
    <link rel="stylesheet" href="./style/index.css">
</head>
<body>
    <h1>Belajar Grid</h1>
    <p>Grid adalah layout model yang memungkinkan Anda untuk mengatur elemen-elemen dalam bentuk grid dua dimensi.</p>
    <div class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
    </div>
    <div class="products">
        <div class="products-item"> Produk 1</div>
        <div class="products-item"> Produk 2</div>
        <div class="products-item"> Produk 3</div>
        <div class="products-item"> Produk 4</div>
        <div class="products-item"> Produk 5</div>
        <div class="products-item"> Produk 6</div>
    </div>


    
</body>
</html>
