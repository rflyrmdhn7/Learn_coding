<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OOP TAKS MANAGER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container-fluid d-flex flex-column align-items-center">
        <div class="card bg-light shadow mt-5 w-50 border-0 py-5">
            <div class="d-flex flex-column w-100 gap-5">
                <h3 class="text-center fw-bold">Productivity</h3>

                <form id="taskForm" class="d-flex flex-column gap-3 px-4">
                    <input type="text" name="taskInput" id="taskInput" placeholder="Ketik tugasmu...," required class="bg-iceblue">
                    <select name="category" id="categoryInput" class="p-2 text-center">
                        <option>-- Pilih Tugas --</option>
                        <option value="Coding">Belajar Coding</option>
                        <option value="Health">Gym</option>
                        <option value="Mental">Sholat</option>
                    </select>
                    <button type="submit" class="btn-blue">Submit</button>
                </form>
            </div>
            <ul id="taskList"></ul>

        </div>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
