<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Membuat Form</title>
</head>
<body>
    <div>
        <h1>Materi Membuat Form</h1>
        <p>Form adalah elemen HTML yang digunakan untuk mengumpulkan input dari pengguna. Form dapat berisi berbagai jenis elemen input seperti teks, tombol, checkbox, radio button, dan lainnya.</p>
        <h2>Contoh Form Sederhana</h2>
        <form action="/submit" method="post">
            <label for="name">Nama:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="message">Pesan:</label><br>
            <textarea id="message" name="message"></textarea><br><br>

            <input type="submit" value="Kirim">
        </form>
    </div>
    
</body>
</html>
